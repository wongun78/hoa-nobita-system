services:
  postgres:
    image: postgres:16-alpine
    container_name: hoanobita-postgres
    environment:
      POSTGRES_DB: hoanobita
      POSTGRES_USER: hoanobita
      POSTGRES_PASSWORD: hoanobita
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoanobita"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
