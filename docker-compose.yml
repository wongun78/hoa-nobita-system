services:
  postgres:
    image: postgres:16-alpine
    container_name: hoanobita-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hoanobita}
      POSTGRES_USER: ${POSTGRES_USER:-hoanobita}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hoanobita}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoanobita"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hoanobita-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-hoanobita}
      DB_USER: ${POSTGRES_USER:-hoanobita}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-hoanobita}
      JWT_SECRET: ${JWT_SECRET:-HoaNobitaLocalDevelopmentJwtSecretKeyMustBeLongEnoughForHS256Algorithm}
      APP_SEED_ENABLED: "true"
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    container_name: hoanobita-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:8080"

volumes:
  pgdata:
