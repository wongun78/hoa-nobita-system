spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false

server:
  port: 0

app:
  jwt:
    secret: TestJwtSecretKeyForTestingPurposesMustBeLongEnoughForHS256Algorithm
    expires-seconds: 3600
  upload-dir: ${java.io.tmpdir}/topik-test-uploads
  cors:
    allowed-origins: http://localhost:5173
  seed:
    enabled: none

logging:
  level:
    com.hoanobita: WARN
    org.springframework.security: WARN
