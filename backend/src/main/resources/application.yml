spring:
  main:
    lazy-initialization: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hoanobita}
    username: ${DB_USER:hoanobita}
    password: ${DB_PASSWORD:hoanobita}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 1024MB
      max-request-size: 1024MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:HoaNobitaLocalDevelopmentJwtSecretKeyMustBeLongEnoughForHS256Algorithm}
    expires-seconds: 3600
  upload-dir: ${UPLOAD_DIR:uploads}
  storage:
    type: ${APP_STORAGE_TYPE:local}
    gcs:
      bucket: ${APP_STORAGE_GCS_BUCKET:}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000,https://*.a.run.app}
  seed:
    enabled: ${APP_SEED_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.hoanobita: INFO
    org.springframework.security: WARN

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
