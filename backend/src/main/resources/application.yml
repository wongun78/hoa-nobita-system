spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hoanobita}
    username: ${DB_USER:hoanobita}
    password: ${DB_PASSWORD:hoanobita}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET:HoaNobitaLocalDevelopmentJwtSecretKeyMustBeLongEnoughForHS256Algorithm}
    expires-seconds: 3600
  upload-dir: ${UPLOAD_DIR:uploads}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  seed:
    enabled: ${APP_SEED_ENABLED:false}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.hoanobita: DEBUG
    org.springframework.security: WARN
