name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-southeast1
  SERVICE_NAME: hoanobita-backend
  IMAGE: asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/hoanobita-repo/backend

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hoanobita_test
          POSTGRES_USER: hoanobita
          POSTGRES_PASSWORD: hoanobita
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Run tests
        run: cd backend && ./mvnw -q test
        env:
          DB_URL: jdbc:postgresql://localhost:5432/hoanobita_test
          DB_USER: hoanobita
          DB_PASSWORD: hoanobita

      - name: Build JAR
        run: cd backend && ./mvnw -q package -DskipTests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          retention-days: 7

  build-and-deploy:
    name: Build & Deploy to Cloud Run
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: test

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Get infrastructure values
        id: infra
        run: |
          DB_IP=$(gcloud sql instances describe hoanobita-db \
            --format='value(ipAddresses[0].ipAddress)')
          echo "db_ip=$DB_IP" >> $GITHUB_OUTPUT

      - name: Get Frontend URL for CORS
        id: frontend
        run: |
          FRONTEND_URL=$(gcloud run services describe hoanobita-frontend \
            --region="${{ env.REGION }}" \
            --format='value(status.url)' 2>/dev/null || echo "")
          echo "url=$FRONTEND_URL" >> $GITHUB_OUTPUT

      - name: Deploy to Cloud Run
        run: |
          CONNECTOR="projects/${{ env.PROJECT_ID }}/locations/${{ env.REGION }}/connectors/hoanobita-connector"
          SA="${{ secrets.WIF_SERVICE_ACCOUNT }}"
          BUCKET="${{ env.PROJECT_ID }}-hoanobita-uploads"

          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image="${{ env.IMAGE }}:${{ github.sha }}" \
            --region="${{ env.REGION }}" \
            --service-account="$SA" \
            --vpc-connector="$CONNECTOR" \
            --vpc-egress=private-ranges-only \
            --set-env-vars="SPRING_DATASOURCE_URL=jdbc:postgresql://${{ steps.infra.outputs.db_ip }}:5432/hoanobita_db" \
            --set-env-vars="SPRING_DATASOURCE_USERNAME=postgres" \
            --set-env-vars="SPRING_FLYWAY_ENABLED=true" \
            --set-env-vars="SPRING_JPA_HIBERNATE_DDL_AUTO=validate" \
            --set-env-vars="APP_SEED_ENABLED=true" \
            --set-env-vars="UPLOAD_DIR=gs://${BUCKET}" \
            --set-env-vars="APP_CORS_ALLOWED_ORIGINS=${{ steps.frontend.outputs.url }}" \
            --set-secrets="SPRING_DATASOURCE_PASSWORD=db-password:latest" \
            --set-secrets="APP_JWT_SECRET=jwt-secret:latest" \
            --memory=1Gi \
            --cpu=1 \
            --cpu-boost \
            --min-instances=0 \
            --max-instances=3 \
            --port=8080 \
            --timeout=300 \
            --allow-unauthenticated

      - name: Summary
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region="${{ env.REGION }}" --format='value(status.url)')
          echo "## Backend Deployed ✅" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $URL" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.IMAGE }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
